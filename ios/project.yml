name: TitanVPS
options:
  bundleIdPrefix: su.titanvps
  # The app is in Russian: Siri's phrases (App Shortcuts) are read as Russian.
  developmentLanguage: ru
  deploymentTarget:
    iOS: "16.0"
packages:
  # HTML of the site's cabinet (like jsoup on Android).
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
targets:
  TitanVPS:
    type: application
    platform: iOS
    # Shared: what the app and TitanWidgets both use (VPN on/off, the Live Activity's data).
    sources: [TitanVPS, Shared]
    dependencies:
      - target: TitanTunnel
        embed: true
      - target: TitanWidgets
        embed: true
      # The real ping (pingBatch) runs Xray in the app too.
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: libresolv.tbd
      - package: SwiftSoup
      # iOS 16.1+: weak, so the app still starts on 16.0.
      - sdk: ActivityKit.framework
        weak: true
    # titanvps://import/<key> and titanvps://add?url=<key> links (same as Android).
    info:
      path: TitanVPS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: su.titanvps.app
            CFBundleURLSchemes: [titanvps]
        # The Live Activity while connected (TitanWidgets draws it).
        NSSupportsLiveActivities: true
        # Siri: how "Titan VPS" sounds in Russian.
        INAlternativeAppNames:
          - INAlternativeAppName: Титан ВПС
          - INAlternativeAppName: Титан ВПН
    entitlements:
      path: TitanVPS/TitanVPS.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: su.titanvps.app
        PRODUCT_NAME: TitanVPS
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Titan VPS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The icon follows the app's theme (Светлая / Тёмная); AppIcon itself has iOS 18's dark and tinted looks.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconLight AppIconDark"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Cronet (Chromium's network stack, for Naive) is linked here, with what it needs.
        OTHER_LDFLAGS: ["-lresolv", "-lc++", "$(PROJECT_DIR)/Frameworks/LibXray.xcframework/libcronet.a",
          "-framework", "CoreTelephony", "-framework", "CryptoTokenKit", "-framework", "LocalAuthentication",
          "-framework", "MobileCoreServices", "-framework", "UniformTypeIdentifiers", "-framework", "SystemConfiguration",
          "-framework", "CoreText", "-framework", "CoreGraphics", "-framework", "CFNetwork", "-framework", "Network",
          "-framework", "Security", "-framework", "UIKit"]

  # The packet tunnel: Xray (LibXray.xcframework, built in CI from XTLS/libXray) on the utun fd.
  TitanTunnel:
    type: app-extension
    platform: iOS
    sources:
      - TitanTunnel
      # The Пункт управления toggle's kind: the tunnel has it read again on start and stop.
      - path: Shared
        includes: [VPNControl.swift]
    dependencies:
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    entitlements:
      path: TitanTunnel/TitanTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: TitanTunnel/Info.plist
      properties:
        CFBundleDisplayName: Titan VPS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: su.titanvps.app.tunnel
        PRODUCT_NAME: TitanTunnel
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: TitanTunnel/TitanTunnel-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        # gomobile's static library: Go needs these when linked into Swift.
        # Cronet (Chromium's network stack, for Naive) is linked here, with what it needs.
        OTHER_LDFLAGS: ["-lresolv", "-lc++", "$(PROJECT_DIR)/Frameworks/LibXray.xcframework/libcronet.a",
          "-framework", "CoreTelephony", "-framework", "CryptoTokenKit", "-framework", "LocalAuthentication",
          "-framework", "MobileCoreServices", "-framework", "UniformTypeIdentifiers", "-framework", "SystemConfiguration",
          "-framework", "CoreText", "-framework", "CoreGraphics", "-framework", "CFNetwork", "-framework", "Network",
          "-framework", "Security", "-framework", "UIKit"]
        ENABLE_BITCODE: NO

  # Widgets (iOS 18 only; on iOS 16–17 the app installs without them): the VPN toggle for
  # Пункт управления, the Lock Screen and the Action button, and the Live Activity. The toggle
  # starts and stops the tunnel itself with the VPN profile the app saved, hence the Network
  # Extension entitlement.
  TitanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [TitanWidgets, Shared]
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: TitanWidgets/TitanWidgets.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: TitanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Titan VPS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: su.titanvps.app.widgets
        PRODUCT_NAME: TitanWidgets
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
