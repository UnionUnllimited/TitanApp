name: TitanVPS
options:
  bundleIdPrefix: su.titanvps
  deploymentTarget:
    iOS: "16.0"
targets:
  TitanVPS:
    type: application
    platform: iOS
    sources: [TitanVPS]
    dependencies:
      - target: TitanTunnel
        embed: true
    entitlements:
      path: TitanVPS/TitanVPS.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: su.titanvps.app
        PRODUCT_NAME: TitanVPS
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Titan VPS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # The packet tunnel: Xray (LibXray.xcframework, built in CI from XTLS/libXray) on the utun fd.
  TitanTunnel:
    type: app-extension
    platform: iOS
    sources: [TitanTunnel]
    dependencies:
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    entitlements:
      path: TitanTunnel/TitanTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: TitanTunnel/Info.plist
      properties:
        CFBundleDisplayName: Titan VPS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: su.titanvps.app.tunnel
        PRODUCT_NAME: TitanTunnel
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: TitanTunnel/TitanTunnel-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        # gomobile's static library: Go needs these when linked into Swift.
        OTHER_LDFLAGS: ["-lresolv"]
        ENABLE_BITCODE: NO
