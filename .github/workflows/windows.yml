name: Windows

on:
  push:
    branches: [main, "claude/**"]
    paths: ["desktop/**", ".github/workflows/windows.yml", "scripts/ios-patches/xray-tfo/**"]
  workflow_dispatch:

# One run at a time per branch: two runs publishing releases at once made one fail.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Xray built here, patched for real TCP Fast Open on Windows (the first data goes in
      # the SYN through ConnectEx; the socket option alone sends none): the same patch as
      # on iOS (scripts/ios-patches/xray-tfo).
      - name: Build xray.exe with TCP Fast Open
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          dest=desktop/resources/windows
          mkdir -p "$dest"
          git clone -q --depth 1 -b v26.9.30 https://github.com/XTLS/Xray-core xray-src
          python scripts/ios-patches/xray-tfo/apply.py xray-src
          cd xray-src
          go get github.com/database64128/tfo-go/v2@v2.4.2
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -buildid=" -o "../$dest/xray.exe" ./main
          ls -la "../$dest/xray.exe"

      # The same geo files as Android, the TUN core and protocol clients.
      - name: Download geo files and clients
        shell: pwsh
        run: |
          $dest = "desktop/resources/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $geo = "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download"
          Invoke-WebRequest -Uri "$geo/geoip.dat" -OutFile "$dest/geoip.dat"
          Invoke-WebRequest -Uri "$geo/geosite.dat" -OutFile "$dest/geosite.dat"
          # TUN mode: sing-box (1.12 config format), wintun is built in.
          # Newest stable 1.12.x (newer lines may change the config format). Tags via git,
          # not the GitHub API (its release listing times out).
          $tags = git ls-remote --tags --refs https://github.com/SagerNet/sing-box.git "refs/tags/v1.12.*" |
            ForEach-Object { ($_ -split "refs/tags/")[1] } | Where-Object { $_ -match '^v1\.12\.\d+$' }
          if (-not $tags) { throw "sing-box 1.12.x not found" }
          $tag = $tags | Sort-Object { [version]($_.TrimStart('v')) } -Descending | Select-Object -First 1
          $ver = $tag.TrimStart('v')
          $asset = [pscustomobject]@{ name = "sing-box-$ver-windows-amd64.zip"; browser_download_url = "https://github.com/SagerNet/sing-box/releases/download/$tag/sing-box-$ver-windows-amd64.zip" }
          $sb = [pscustomobject]@{ tag_name = $tag }
          Write-Host "sing-box $($sb.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath singbox
          Copy-Item (Get-ChildItem singbox -Recurse -Filter sing-box.exe | Select-Object -First 1).FullName $dest/
          # Naive / Mieru servers: their own clients (Plugins.kt).
          $h = @{ Authorization = "Bearer ${{ github.token }}" }
          $nv = (Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/klzgrad/naiveproxy/releases/latest").assets | Where-Object { $_.name -like "naiveproxy-*-win-x64.zip" } | Select-Object -First 1
          Write-Host "naive: $($nv.name)"
          Invoke-WebRequest -Uri $nv.browser_download_url -OutFile naive.zip
          Expand-Archive naive.zip -DestinationPath naive
          Copy-Item (Get-ChildItem naive -Recurse -Filter naive.exe | Select-Object -First 1).FullName $dest/
          $mr = (Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/enfein/mieru/releases/latest").assets | Where-Object { $_.name -like "mieru_*_windows_amd64.zip" } | Select-Object -First 1
          Write-Host "mieru: $($mr.name)"
          Invoke-WebRequest -Uri $mr.browser_download_url -OutFile mieru.zip
          Expand-Archive mieru.zip -DestinationPath mieru
          Copy-Item (Get-ChildItem mieru -Recurse -Filter mieru.exe | Select-Object -First 1).FullName $dest/
          Get-ChildItem $dest

      # Round flag images: Windows has no flag emoji.
      - name: Download flag images
        shell: pwsh
        run: |
          npm pack flag-icons --silent
          tar -xzf (Get-ChildItem flag-icons-*.tgz).Name
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/flags | Out-Null
          Copy-Item package/flags/1x1/*.svg desktop/src/main/resources/flags/
          (Get-ChildItem desktop/src/main/resources/flags).Count

      - name: Build installer
        run: .\gradlew.bat -p desktop packageMsi createDistributable --no-daemon

      # Our own installer (Inno Setup): branded wizard in Russian; /VERYSILENT for app updates.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $app = Resolve-Path "desktop/build/compose/binaries/main/app/Titan VPS"
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "/DAppDir=$app" desktop/installer/titan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out, release | Out-Null
          Copy-Item "out/inno/titan-vps-setup.exe" "out/Titan VPS Setup.exe"
          Copy-Item "desktop/build/compose/binaries/main/msi/*.msi" "out/Titan VPS.msi"
          Compress-Archive -Path "desktop/build/compose/binaries/main/app/Titan VPS" -DestinationPath "out/Titan VPS portable.zip"
          Copy-Item "out/inno/titan-vps-setup.exe" "release/titan-vps-setup.exe"
          # Kept for apps up to windows-<this>: their updater installs the MSI.
          Copy-Item "out/Titan VPS.msi" "release/titan-vps.msi"
          Get-ChildItem out, release

      # The app's "Обновление приложения" looks for the newest windows-<build> release.
      # Not "latest": Android reads releases/latest.
      - name: Publish release for in-app updates
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Titan VPS для Windows 1.0.${{ github.run_number }}
          make_latest: false
          files: release/*

      - uses: actions/upload-artifact@v4
        with:
          name: Titan VPS Setup (Windows)
          path: out/Titan VPS Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Titan VPS (Windows, other formats)
          path: |
            out/Titan VPS.msi
            out/Titan VPS portable.zip
