name: Node binaries

# Programs for our nodes, built here so a node needs no Go:
#   titan-mieru-gw (server/titan-mieru-gw), linux amd64 → release "node-binaries".
#   titan-sbgw (server/titan-sbgw): official sing-box + patches/hot-users.patch.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["server/titan-mieru-gw/**", "server/titan-sbgw/**", ".github/workflows/node-binaries.yml"]
  workflow_dispatch:

concurrency:
  group: node-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/titan-sbgw/go.mod
          cache-dependency-path: |
            server/titan-mieru-gw/go.sum
            server/titan-sbgw/go.sum

      - name: Build
        run: |
          mkdir -p out
          cd server/titan-mieru-gw
          # mieru with runtime user updates: vendor, patch (patches/hot-users.patch), build.
          go mod vendor
          patch -p1 < patches/hot-users.patch
          go vet -mod=vendor .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -trimpath -ldflags "-s -w" -o ../../out/titan-mieru-gw-linux-amd64 .
          # sing-box with runtime user updates: vendor the official modules, patch, build.
          cd ../titan-sbgw
          go mod vendor
          patch -p1 < patches/hot-users.patch
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -tags with_quic -trimpath -ldflags "-s -w" -o ../../out/titan-sbgw-linux-amd64 .
          cd ../../out && sha256sum titan-* | tee SHA256SUMS

      - name: Publish
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: node-binaries
          target_commitish: ${{ github.sha }}
          name: Программы для нод
          make_latest: false
          files: out/*
