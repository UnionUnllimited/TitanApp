name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      libxray_ref:
        description: libXray git ref (tag or branch)
        default: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache libXray.aar
        id: libxray-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libXray.aar
          key: libxray-${{ github.event.inputs.libxray_ref || 'main' }}-${{ hashFiles('scripts/build-libxray.sh') }}

      - name: Build libXray
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        env:
          LIBXRAY_REF: ${{ github.event.inputs.libxray_ref || 'main' }}
        run: ./scripts/build-libxray.sh

      - name: Download geo files
        run: ./scripts/download-geo.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TitanVPS-debug
          path: app/build/outputs/apk/debug/*.apk

      # Prebuilt core + geo files for local builds in Android Studio
      # (unzip into the project root, no Go/NDK needed on your machine).
      - name: Pack native dependencies
        run: |
          mkdir -p deps/app/libs deps/app/src/main/assets
          cp app/libs/libXray.aar deps/app/libs/
          cp app/src/main/assets/*.dat deps/app/src/main/assets/

      - uses: actions/upload-artifact@v4
        with:
          name: TitanVPS-deps
          path: deps/

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
