name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      libxray_ref:
        description: libXray git ref (tag or branch)
        default: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release for in-app updates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache libXray.aar
        id: libxray-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libXray.aar
          key: libxray-${{ github.event.inputs.libxray_ref || 'main' }}-${{ hashFiles('scripts/build-libxray.sh') }}

      - name: Build libXray
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        env:
          LIBXRAY_REF: ${{ github.event.inputs.libxray_ref || 'main' }}
        run: ./scripts/build-libxray.sh

      - name: Download geo files
        run: ./scripts/download-geo.sh

      # Naive / Mieru servers: their clients run as local SOCKS (core/Plugins.kt).
      - name: Download Naive and Mieru clients
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/download-plugins.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        run: ./gradlew assembleRelease

      # "Titan VPS.apk" is universal (any phone); the per-CPU ones are smaller.
      - name: Name APKs
        run: |
          mkdir -p out/universal out/split
          cd app/build/outputs/apk/release
          cp *-universal-release.apk "../../../../../out/universal/Titan VPS.apk"
          cp *-arm64-v8a-release.apk "../../../../../out/split/Titan VPS arm64.apk"
          cp *-armeabi-v7a-release.apk "../../../../../out/split/Titan VPS armv7.apk"
          mkdir -p ../../../../../out/release
          cp *-universal-release.apk ../../../../../out/release/titan-vps-universal.apk
          cp *-arm64-v8a-release.apk ../../../../../out/release/titan-vps-arm64.apk
          cp *-armeabi-v7a-release.apk ../../../../../out/release/titan-vps-armv7.apk

      # The app's "Обновление приложения" reads releases/latest (tag android-<versionCode>).
      - name: Publish release for in-app updates
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Titan VPS 0.1.${{ github.run_number }}
          make_latest: true
          files: out/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Titan VPS
          path: out/universal/

      - uses: actions/upload-artifact@v4
        with:
          name: Titan VPS (arm64, armv7)
          path: out/split/

      # Prebuilt core + geo files for local builds in Android Studio
      # (unzip into the project root, no Go/NDK needed on your machine).
      - name: Pack native dependencies
        run: |
          mkdir -p deps/app/libs deps/app/src/main/assets
          cp app/libs/libXray.aar deps/app/libs/
          cp app/src/main/assets/*.dat deps/app/src/main/assets/

      - uses: actions/upload-artifact@v4
        with:
          name: TitanVPS-deps
          path: deps/

