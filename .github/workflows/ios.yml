name: iOS

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned build: Sideloadly / AltStore re-sign it with the user's Apple ID.
      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project TitanVPS.xcodeproj -scheme TitanVPS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TitanVPS.app Payload/
          zip -qr TitanVPS-unsigned.ipa Payload

      # A plain download link (artifacts need a GitHub login): for signing services
      # (UDID certificate) and Sideloadly. Not "latest": Android reads releases/latest.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Titan VPS для iOS (неподписанный IPA) ${{ github.run_number }}
          make_latest: false
          files: ios/TitanVPS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TitanVPS-iOS-unsigned
          path: ios/TitanVPS-unsigned.ipa
